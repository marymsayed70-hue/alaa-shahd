<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alaa & Shahd</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    body {
      font-family: Arial, sans-serif;
    }

    #flowersScene,
    #envelopeScene,
    #inviteScene,
    #finalScene {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    #flowersScene img,
    #envelopeScene img,
    #inviteScene img,
    #finalScene img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #flowersScene {
      display: flex;
      opacity: 1;
      transition: opacity 1s ease;
      z-index: 1;
    }

    #envelopeScene {
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      opacity: 1;
      transition: opacity 1s ease;
      z-index: 2;
    }

    #envelope {
      width: min(80vw, 500px);
      height: auto !important;
      object-fit: contain !important;
      cursor: pointer;
    }

    .openText {
      margin-top: 20px;
      color: white;
      font-size: 18px;
      letter-spacing: 3px;
      text-shadow: 0 2px 5px #000;
    }

    #inviteScene {
      display: none;
      align-items: center;
      justify-content: center;
      opacity: 1;
      z-index: 3;
    }

    #invite {
      opacity: 0;
      transform: scale(0.96);
      transition: opacity 1.5s ease, transform 1.5s ease;
    }

    #invite.show {
      opacity: 1;
      transform: scale(1);
    }

    #heart {
      position: absolute;
      bottom: 35px;
      left: 50%;
      transform: translateX(-50%) scale(0);
      width: 65px;
      height: 65px;
      border: none;
      border-radius: 50%;
      background: white;
      color: #e85d75;
      font-size: 34px;
      cursor: pointer;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.25);
      opacity: 0;
    }

    #heart.show {
      opacity: 1;
      transform: translateX(-50%) scale(1);
      transition: transform 0.5s ease, opacity 0.5s ease;
    }

    #finalScene {
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 4;
    }

    #finalScene img {
      opacity: 0;
      transform: scale(1.05);
      transition: opacity 2s ease, transform 2s ease;
    }

    #finalScene img.show {
      opacity: 1;
      transform: scale(1);
    }
  </style>
</head>

<body>

  <div id="flowersScene">
    <img src="file_000000005d4082118a90fa08f9eb0fcb.png" alt="">
  </div>

  <div id="envelopeScene">
    <img id="envelope" src="file_00000000f12c820d8652b632d299c630.png" alt="">
    <div class="openText">CLICK TO OPEN..</div>
  </div>

  <div id="inviteScene">
    <img id="invite" src="Picsart_26-09-09_22-36-31-917.png" alt="">
    <button id="heart">♥</button>
  </div>

  <div id="finalScene">
    <img src="IMG_20260909_222332_886.webp" alt="">
  </div>

  <audio id="music" preload="auto" loop>
    <source src="c03312eb25fcbb733a86f27dcc90a851.mp3" type="audio/mpeg">
  </audio>

  <script>
    const flowersScene = document.getElementById("flowersScene");
    const envelopeScene = document.getElementById("envelopeScene");
    const envelope = document.getElementById("envelope");
    const inviteScene = document.getElementById("inviteScene");
    const invite = document.getElementById("invite");
    const heart = document.getElementById("heart");
    const finalScene = document.getElementById("finalScene");
    const music = document.getElementById("music");

    setTimeout(() => {
      flowersScene.style.opacity = "0";

      setTimeout(() => {
        flowersScene.style.display = "none";
        envelopeScene.style.display = "flex";
      }, 1000);
    }, 3500);

    envelope.addEventListener("click", () => {
      music.currentTime = 0;
      music.volume = 0.45;

      music.play().catch((error) => {
        console.log("Music could not play:", error);
      });

      envelopeScene.style.opacity = "0";

      setTimeout(() => {
        envelopeScene.style.display = "none";
        inviteScene.style.display = "flex";

        setTimeout(() => {
          invite.classList.add("show");
          heart.classList.add("show");
        }, 100);
      }, 1000);
    });

    heart.addEventListener("click", () => {
      inviteScene.style.display = "none";
      finalScene.style.display = "flex";

      setTimeout(() => {
        finalScene.querySelector("img").classList.add("show");
      }, 100);
    });
  </script>

</body>
</html>
